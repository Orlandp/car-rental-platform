server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Flask API - proxied so the browser sees everything as one origin (no CORS,
    # and the session cookie works without cross-site cookie settings).
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded vehicle photos / company logo, served by Flask's static handler.
    location /static/ {
        proxy_pass http://backend:5000;
    }

    # React Router SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
